[project]
name = "halo-light"
version = "0.1.0"
description = "Serveur MCP pour Philips Hue (API CLIP v2) : lumieres, pieces, scenes, par identifiant ou par nom."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "amineutron", email = "56112165+amineutron@users.noreply.github.com" }]
maintainers = [{ name = "amineutron", email = "56112165+amineutron@users.noreply.github.com" }]
keywords = ["mcp", "philips-hue", "hue", "smart-home", "lighting", "home-automation"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
]
requires-python = ">=3.10"
dependencies = [
    "mcp>=2.2,<3",
    "httpx>=0.27",
]

[project.urls]
Homepage = "https://github.com/amineutron/halo-light"
Repository = "https://github.com/amineutron/halo-light"
Issues = "https://github.com/amineutron/halo-light/issues"
Changelog = "https://github.com/amineutron/halo-light/blob/main/CHANGELOG.md"

[project.optional-dependencies]
mdns = ["zeroconf>=0.130"]

[project.scripts]
halo-light = "halo_light.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/halo_light"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "C4", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
